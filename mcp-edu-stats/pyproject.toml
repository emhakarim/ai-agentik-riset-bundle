[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-stats"
version = "0.1.0"
description = "MCP statistik deterministik untuk riset pendidikan"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.15",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pingouin>=0.5"]
# Diuji 2026-11-14 dengan mcp 2.3.0 (MCPServer, klien stdio); server.py juga mendukung FastMCP (1.x).
server = ["mcp>=1.2,<3"]

[project.scripts]
edu-stats = "edu_stats.cli:main"
edu-stats-server = "edu_stats.server:main"

[tool.setuptools]
packages = ["edu_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
