[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-tools"
version = "0.1.0"
description = "Deterministic local checks for research manuscripts: cited claims, numbers traced to results, references vs Crossref, response letters"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper-check = "paper_tools.cli:main"

[tool.setuptools]
packages = ["paper_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
